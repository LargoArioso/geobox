appId: com.geobox.app
productName: GeoBox 地理课件舱
directories:
  output: dist
files:
  - out/**
  - package.json
win:
  target:
    - nsis
    - portable
fileAssociations:
  - ext: gpak
    name: GeoBox 课件包
    role: Viewer
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: GeoBox
