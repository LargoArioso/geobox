<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>示例课件·地形演示</title>
  <style>
    body { margin: 0; font-family: 'Microsoft YaHei', sans-serif; background: #0c4a6e; color: #fff;
           display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    h1 { font-size: 48px; margin-bottom: 16px; }
    p { font-size: 20px; opacity: 0.85; }
    button { margin-top: 24px; padding: 14px 32px; font-size: 18px; border-radius: 10px;
             border: none; background: #38bdf8; color: #082f49; cursor: pointer; }
    #log { margin-top: 20px; font-size: 14px; opacity: 0.7; max-width: 80%; word-break: break-all; }
  </style>
</head>
<body>
  <h1>🏔️ 示例课件运行成功</h1>
  <p>这是一个普通 HTML 课件，用于验证 GeoBox 播放器与桥接 API。</p>
  <button id="btn">测试导入文件（桥接 API）</button>
  <div id="log"></div>
  <script>
    const log = (msg) => (document.getElementById('log').textContent = msg)
    if (window.geobox) {
      log('检测到 GeoBox 运行时：' + JSON.stringify({ platform: window.geobox.platform }))
      document.getElementById('btn').onclick = async () => {
        const f = await window.geobox.importFile({ accept: ['.json', '.geojson', '.txt'] })
        log(f ? `已选择文件：${f.name}（${f.data.byteLength} 字节）` : '已取消选择')
      }
    } else {
      log('未检测到 GeoBox 运行时（作为普通网页打开）')
    }
  </script>
</body>
</html>
